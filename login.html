<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Ciclo de Vida do Software</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0a192f;
            color: #e2e8f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Card de login com a bordinha verde suave igual ao padrão das outras páginas */
        .login-card {
            background-color: #112240;
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 12px;
            padding: 40px 30px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 20px -5px rgba(2, 12, 27, 0.7);
        }

        h2 {
            color: #10b981;
            font-size: 1.8rem;
            font-weight: bold;
            margin-bottom: 25px;
            text-align: center;
            text-shadow: 0 0 10px rgba(16, 185, 129, 0.3);
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #94a3b8;
            font-size: 0.9rem;
        }

        input {
            width: 100%;
            padding: 12px 15px;
            background-color: #0a192f;
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 6px;
            color: #e2e8f0;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        input:focus {
            border-color: #10b981;
            box-shadow: 0 0 8px rgba(16, 185, 129, 0.3);
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background-color: #10b981;
            color: #0f172a;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.2s;
        }

        .btn-submit:hover {
            background-color: #34d399;
        }

        .signup-link {
            margin-top: 20px;
            text-align: center;
            font-size: 0.9rem;
            color: #94a3b8;
        }

        .signup-link a {
            color: #10b981;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .signup-link a:hover {
            color: #34d399;
            text-decoration: underline;
        }

        .back-link {
            margin-top: 20px;
            text-align: center;
        }

        .back-link a {
            display: inline-block;
            width: 100%;
            padding: 12px 24px;
            background-color: #1e293b;
            color: #ffffff;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.95rem;
            transition: background-color 0.2s;
        }

        .back-link a:hover {
            background-color: #334155;
            color: #10b981;
        }
    </style>
</head>
<body>
  <div class="login-card">
    <h2>Área de Acesso</h2>

    <form id="loginForm">
      <div class="form-group">
        <label for="email">E-mail</label>
        <input type="email" id="email" required placeholder="seu@email.com">
      </div>

      <div class="form-group">
        <label for="password">Senha</label>
        <input type="password" id="password" required placeholder="••••••••">
      </div>

      <button type="submit" class="btn-submit">Entrar</button>
    </form>

    <div class="signup-link">
      Não tem uma conta? <a href="cadastro.html">Cadastre-se</a>
    </div>

    <div class="back-link">
      <a href="index.html">← Voltar ao Início</a>
    </div>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const email = document.getElementById('email').value;
      alert('Login efetuado com sucesso! Bem-vindo, ' + email);
      window.location.href = 'index.html';
    });
  </script>
</body>
</html>
