<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Ciclo de Vida do Software</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0a192f;
            color: #e2e8f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-card {
            background-color: #112240;
            border: 1px solid #10b98144;
            border-radius: 12px;
            padding: 40px 30px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 0 25px rgba(16, 185, 129, 0.15), 
                        0 10px 20px -5px rgba(2, 12, 27, 0.7);
        }

        h2 {
            color: #10b981;
            font-size: 1.8rem;
            font-weight: bold;
            margin-bottom: 25px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 18px;
        }

        label {
            display: block;
            color: #94a3b8;
            font-size: 0.9rem;
            margin-bottom: 6px;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 12px;
            background-color: #0a192f;
            border: 1px solid #10b98144;
            border-radius: 8px;
            color: #e2e8f0;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s ease;
        }

        input:focus {
            border-color: #10b981;
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.3);
        }

        .btn-submit {
            width: 100%;
            background-color: #10b981;
            color: #0f172a;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.2s ease;
        }

        .btn-submit:hover {
            background-color: #34d399;
        }

        .signup-text {
            margin-top: 15px;
            font-size: 0.85rem;
            color: #94a3b8;
        }

        .signup-text a {
            color: #10b981;
            text-decoration: none;
            font-weight: 600;
        }

        .back-link {
            margin-top: 25px;
            text-align: center;
        }

        .back-link a {
            color: #94a3b8;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .back-link a:hover {
            color: #10b981;
        }
    </style>
</head>
<body>
  <div class="login-card">
    <h2>Criar Conta</h2>

    <form id="signupForm">
      <div class="form-group">
        <label for="nome">Nome Completo</label>
        <input type="text" id="nome" placeholder="Seu nome" required>
      </div>

      <div class="form-group">
        <label for="email">E-mail</label>
        <input type="email" id="email" placeholder="seu@email.com" required>
      </div>

      <div class="form-group">
        <label for="password">Senha</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn-submit">Cadastrar</button>
    </form>

    <div class="signup-text">
      Já possui uma conta? <a href="login.html">Faça Login</a>
    </div>

    <div class="back-link">
      <a href="index.html">← Voltar ao Início</a>
    </div>
  </div>

  <script>
    document.getElementById('signupForm').addEventListener('submit', function(e) {
      e.preventDefault();
      alert('Cadastro realizado com sucesso! Redirecionando para o login...');
      window.location.href = 'login.html';
    });
  </script>
</body>
</html>
